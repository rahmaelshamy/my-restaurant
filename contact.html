<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - My Restaurant</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">My Restaurant</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link text-white px-3" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white px-3" href="about.html">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active text-white px-3" href="contact.html">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTACT SECTION -->
  <div class="container mt-5">
    <h2 class="mb-4">Contact Us</h2>

    <!-- SUCCESS MESSAGE -->
    <div id="success_message" class="alert alert-success" style="display: none;">
      Message sent successfully!
    </div>

    <!-- FORM -->
    <form id="submit_form">

      <input 
        type="text" 
        name="name" 
        class="form-control mb-3" 
        placeholder="Name" 
        required
      >

      <input 
        type="email" 
        name="email" 
        class="form-control mb-3" 
        placeholder="Email" 
        required
      >

      <input 
        type="tel" 
        name="phone" 
        class="form-control mb-3" 
        placeholder="Phone" 
        pattern="[0-9]{11}" 
        maxlength="11"
        required
      >

      <textarea 
        name="message" 
        class="form-control mb-3" 
        rows="5" 
        placeholder="Message" 
        required
      ></textarea>

      <button type="submit" class="btn btn-success w-100">
        Submit
      </button>

    </form>
  </div>

  <!-- FOOTER -->
  <footer class="bg-success text-white text-center p-3 mt-5">
    © 2026 My Restaurant
  </footer>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
